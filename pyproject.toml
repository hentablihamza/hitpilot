[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hitpilot"
version = "0.1.0"
description = "Auditable hit-triage and med-chem copilot for public virtual-screening benchmarks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hentabli Hamza" }]
keywords = ["cheminformatics", "hit-triage", "rdkit", "lit-pcba", "virtual-screening"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "rdkit",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "requests",
  "pydantic",
  "typer",
  "rich",
  "mcp",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hitpilot = "hitpilot.cli:app"
hitpilot-mcp = "hitpilot.mcp_server:main"

[project.urls]
Homepage = "https://github.com/hentablihamza/hitpilot"
Repository = "https://github.com/hentablihamza/hitpilot"
Issues = "https://github.com/hentablihamza/hitpilot/issues"
Changelog = "https://github.com/hentablihamza/hitpilot/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/hitpilot",
  "tests",
  "README.md",
  "LICENSE",
  "CITATION.cff",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "pyproject.toml",
  "docs",
  "examples",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
  "network: tests that require live network access (skipped in CI)",
]
